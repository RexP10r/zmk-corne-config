CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y
CONFIG_ZMK_SPLIT_BLE=y
CONFIG_USB_DEVICE_STACK=y

# ==============

# Enable RGB Underglow
CONFIG_ZMK_RGB_UNDERGLOW=y

# WS2812 LED strip driver (SPI backend) for the led_strip node in corne.keymap
CONFIG_SPI=y
CONFIG_WS2812_STRIP=y

# Start with the Spectrum (Rainbow) effect automatically
# 0=Solid, 1=Breathe, 2=Spectrum(Rainbow), 3=Swirl
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=2

# Animation speed (1 to 5)
CONFIG_ZMK_RGB_UNDERGLOW_SPD_START=3

# NOTE: AUTO_OFF_USB forces LEDs off whenever the half runs on battery,
# and AUTO_OFF_IDLE turns them off after 30 s without keypresses.
# Re-enable only if you want that battery-saving behavior:
# CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y
# CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_USB=y

# ==============

# Enable Display and Custom Screen
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y

# Enable nice!oled module compatibility
CONFIG_NICE_OLED_ON=y

# --- Central Screen (Left Half) ---
# Shows WPM (Words Per Minute) with Bongo Cat typing animation
CONFIG_NICE_OLED_WIDGET_WPM=y
CONFIG_NICE_OLED_WIDGET_WPM_BONGO_CAT=y
CONFIG_NICE_OLED_WIDGET_WPM_BONGO_CAT_ANIMATION_MS=300
