CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
CONFIG_ZMK_SPLIT_BLE=y
CONFIG_USB_DEVICE_STACK=n
# Enable RGB Underglow
CONFIG_ZMK_RGB_UNDERGLOW=y

# Start with the Spectrum (Rainbow) effect automatically
# 0=Solid, 1=Breathe, 2=Spectrum(Rainbow), 3=Swirl
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=2

# Animation speed (1 to 5)
CONFIG_ZMK_RGB_UNDERGLOW_SPD_START=3

# (Optional) Turn off LEDs when idle or USB disconnected to save battery
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_USB=y
